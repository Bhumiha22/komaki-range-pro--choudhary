name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: komaki-x1-range-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Phone-friendly download: always at Releases -> "latest"
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KomakiX1RangePro.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KomakiX1RangePro.apk --prerelease \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Download KomakiX1RangePro.apk on your phone and install it."
